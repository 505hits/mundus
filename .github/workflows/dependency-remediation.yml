name: Dependency remediation generator

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Generate patched dependency files
        run: |
          npm install next@16.4.5 nodemailer@10.1.4 --save-exact --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || true
          npm audit --audit-level=high

      - name: Upload patched dependency files
        uses: actions/upload-artifact@v4
        with:
          name: patched-dependencies
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
