name: One-time Next security upgrade

on:
  push:
    branches:
      - mundus-portal
    paths:
      - .github/workflows/next-security-upgrade.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: mundus-portal

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install current lockfile
        run: npm ci

      - name: Upgrade patched Next.js
        run: npm install --save-exact next@16.3.8 eslint-config-next@16.3.8

      - name: Block critical dependency advisories
        run: npm audit --audit-level=critical

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-build-key

      - name: Commit verified security upgrade
        run: |
          rm .github/workflows/next-security-upgrade.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/next-security-upgrade.yml
          git commit -m "Upgrade Next.js security patch [skip ci]"
          git push origin HEAD:mundus-portal
