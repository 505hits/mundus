name: Dependency remediation generator

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/market-leader-conversion'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'feat/market-leader-conversion' }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Patch vulnerable dependencies
        run: |
          npm install next@16.4.5 nodemailer@10.1.4 --save-exact --package-lock-only --ignore-scripts
          npm install eslint-config-next@16.4.5 --save-dev --save-exact --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || true
          npm audit --audit-level=high

      - name: Commit patched dependency files
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency files already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Patch vulnerable production dependencies"
          git push origin HEAD:${{ github.head_ref || 'feat/market-leader-conversion' }}
