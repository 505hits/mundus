name: Update portal package lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mundus-portal
        uses: actions/checkout@v4
        with:
          ref: mundus-portal

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Update package lockfile
        run: npm install --package-lock-only

      - name: Commit updated lockfile to mundus-portal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Update package lockfile for Supabase"
          git push origin HEAD:mundus-portal
