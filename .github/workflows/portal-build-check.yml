name: Portal build check

on:
  push:
    branches:
      - mundus-portal
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: portal-build-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint portal
        run: npm run lint

      - name: Test portal safeguards and assessment drafts
        run: npm test

      - name: Build portal
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-build-key
