name: One-time nonbreaking audit fix

on:
  push:
    branches:
      - mundus-portal
    paths:
      - .github/workflows/nonbreaking-audit-fix.yml

permissions:
  contents: write

concurrency:
  group: mundus-one-time-audit-fix
  cancel-in-progress: true

jobs:
  audit-fix:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: mundus-portal

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install current lockfile
        run: npm ci

      - name: Apply nonbreaking audit fixes
        run: npm audit fix

      - name: Verify no critical advisories
        run: npm audit --audit-level=critical

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-build-key

      - name: Commit verified nonbreaking audit fixes
        run: |
          rm -f .github/workflows/nonbreaking-audit-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/nonbreaking-audit-fix.yml
          git diff --cached --quiet || git commit -m "Apply nonbreaking dependency security fixes [skip ci]"
          git push origin HEAD:mundus-portal
